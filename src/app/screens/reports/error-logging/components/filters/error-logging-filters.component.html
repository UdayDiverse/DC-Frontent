<div class="filters-box">
    <div class="dynamic-form-row row-gap-0">
        <div class="col-lg-2 col-md-2">
            <div class="custom-form-input">
                <label for="">From Date</label>
                <div class="input-group datepicker">
                    <input class="form-control " [(ngModel)]="fromDate" placeholder="yyyy-mm-dd" name="fromDt"
                        [autoClose]="true" ngbDatepicker #fromDt="ngbDatepicker" />
                    <button class="btn btn-outline-secondary bi bi-calendar3" (click)="fromDt.toggle()" type="button">
                    </button>
                </div>
            </div>
        </div>

        <div class="col-lg-2 col-md-2">
            <div class="custom-form-input">
                <label for="">To Date</label>
                <div class="input-group datepicker">
                    <input class="form-control" [(ngModel)]="toDate" placeholder="yyyy-mm-dd" name="toDate"
                        [autoClose]="true" ngbDatepicker #toDt="ngbDatepicker" />
                    <button class="btn btn-outline-secondary bi bi-calendar3" (click)="toDt.toggle()" type="button">
                    </button>
                </div>
            </div>
        </div>

        <div class="">
            <div class="custom-form-input">
                <label for="">Response Code</label>
                <ng-select class="input-field" [(ngModel)]="responseCode" placeholder="Select Response Code">
                    @for (code of filters?.ResponseCode; track $index) {
                    <ng-option [value]="code">{{code}}</ng-option>
                    }
                </ng-select>
            </div>
        </div>

        <div class="">
            <div class="custom-form-input">
                <label for="">Message Source</label>
                <ng-select class="input-field" [(ngModel)]="messageSource" placeholder="Select Message Source">
                    @for (code of filters?.MessageSource; track $index) {
                    <ng-option [value]="code">{{code}}</ng-option>
                    }
                </ng-select>
            </div>
        </div>

        <div class="">
            <div class="custom-form-input">
                <label for="">Method Name</label>
                <ng-select class="input-field" [(ngModel)]="methodName" placeholder="Select Method Name">
                    @for (code of filters?.MethodName; track $index) {
                    <ng-option [value]="code">{{code}}</ng-option>
                    }
                </ng-select>
            </div>
        </div>

        <div class="col-lg-2 d-flex gap-3 align-items-center">
            <div class="custom-form-input">
                <label for="" class="d-block">&nbsp;</label>
                <div class="d-flex">
                    <button class="custom-button-filters" type="button" (click)="handleSearch()"
                        [disabled]="fromDate() === undefined && toDate() === undefined && messageSource() === undefined && methodName() === undefined && responseCode() === undefined">Search</button>
                    <button class="custom-button-filters ms-2" (click)="onClearFilter()"
                        [disabled]="fromDate() === undefined && toDate() === undefined && messageSource() === undefined && methodName() === undefined && responseCode() === undefined">Clear</button>
                    <button class="custom-button-export ms-2" (click)="exportData()">
                        <img src="assets/images/icons/excel.svg" alt="export" /> Export
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
